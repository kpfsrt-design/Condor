<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Platform Core - Condor EMS v2.0</title>
  <style>
    :root {
      --primary: #1B365D;
      --secondary: #4A777A;
      --accent: #2C5282;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text-main: #1A202C;
      --text-muted: #718096;
      --border: #E2E8F0;
      --danger: #E53E3E;
      --success: #38A169;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* Component: Modals & Overlays */
    .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .card-dialog { background: var(--surface); border-radius: 8px; width: 400px; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
    .card-dialog h2 { margin-bottom: 20px; color: var(--primary); font-size: 22px; text-align: center; }

    /* Layout Shell */
    #sidebar { width: 260px; background: var(--primary); color: white; display: flex; flex-direction: column; }
    .brand-header { padding: 24px 20px; font-weight: 700; font-size: 18px; letter-spacing: 0.5px; background: rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px; }
    .nav-list { list-style: none; margin-top: 15px; flex: 1; }
    .nav-item { padding: 14px 20px; color: #A0AEC0; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: all 0.2s; font-size: 14px; }
    .nav-item:hover, .nav-item.active { color: white; background: rgba(255,255,255,0.08); border-left: 4px solid #63B3ED; }

    #workspace { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    header { background: var(--surface); padding: 16px 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .main-content { padding: 32px; }

    /* UI Primitives */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; color: var(--text-muted); }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; }
    input:focus { border-color: var(--accent); }
    
    .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-block { width: 100%; }
    .btn-danger { background: var(--danger); }

    .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 6px; color: white; background: #2D3748; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: none; z-index: 2000; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- AUTHENTICATION MODULE -->
  <div id="authContainer" class="overlay">
    <div id="loginCard" class="card-dialog">
      <h2 id="appBrandTitle">Condor Platform</h2>
      <form onsubmit="handleAuthLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="authEmail" required placeholder="admin@condor.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="authPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-block">Sign In</button>
      </form>
      <p style="text-align: center; margin-top: 16px; font-size: 13px;">
        New tenant account? <a href="#" onclick="toggleAuthMode('register')">Register here</a>
      </p>
    </div>

    <div id="registerCard" class="card-dialog hidden">
      <h2>Tenant Registration</h2>
      <form onsubmit="handleAuthRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Work Email</label>
          <input type="email" id="regEmail" required placeholder="user@company.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-block">Register Account</button>
      </form>
      <p style="text-align: center; margin-top: 16px; font-size: 13px;">
        Existing account? <a href="#" onclick="toggleAuthMode('login')">Sign In</a>
      </p>
    </div>
  </div>

  <!-- APPLICATION SHELL -->
  <div id="sidebar">
    <div class="brand-header">
      <span id="navTenantName">Condor Footwear</span>
    </div>
    <ul class="nav-list">
      <li class="nav-item active" onclick="navigate('dashboard')">Dashboard</li>
      <li class="nav-item" onclick="navigate('settings')">System Settings</li>
    </ul>
  </div>

  <div id="workspace">
    <header>
      <h3 id="viewTitle">Dashboard</h3>
      <div>
        <span id="userContext" style="font-size: 14px; font-weight: 600; margin-right: 15px;"></span>
        <button class="btn btn-danger" onclick="logout()">Sign Out</button>
      </div>
    </header>

    <div class="main-content">
      <!-- VIEW: DASHBOARD -->
      <div id="viewDashboard" class="view-panel">
        <div style="background: white; padding: 24px; border-radius: 8px; border: 1px solid var(--border);">
          <h2>SaaS Architecture Status</h2>
          <p style="margin-top: 8px; color: var(--text-muted);">Platform core version 2.0.0 active. Dynamic module loading enabled.</p>
        </div>
      </div>

      <!-- VIEW: SETTINGS -->
      <div id="viewSettings" class="view-panel hidden">
        <div style="background: white; padding: 24px; border-radius: 8px; border: 1px solid var(--border); max-width: 600px;">
          <h2 style="margin-bottom: 20px;">Company System Settings</h2>
          <form onsubmit="handleSaveSetting(event)">
            <div class="form-group">
              <label>Application Branding Name</label>
              <input type="text" id="settingAppName" placeholder="Condor Enterprise Suite">
            </div>
            <button type="submit" class="btn">Save Configuration</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    /* ==========================================================================
       CORE SAAS CLIENT ENGINE
       ========================================================================== */
    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbz4psjWTTUgkG9jFTVVsB2Y-YXE_GeffL72THn3j2wafpju3hjbNkQSuxX2neVZrvV0yg/exec";
    
    let AppState = {
      user: null,
      tenantId: 'COMP-1001',
      settings: {}
    };

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    async function apiRequest(action, payload = {}, method = 'POST') {
      try {
        let options = { method: method };
        let url = API_ENDPOINT;

        if (method === 'POST') {
          payload.action = action;
          payload.companyId = AppState.tenantId;
          options.body = JSON.stringify(payload);
        } else {
          url += `?action=${action}&companyId=${AppState.tenantId}`;
        }

        const response = await fetch(url, options);
        const result = await response.json();
        
        if (!result.success) throw new Error(result.error || 'API Request Failed');
        return result.data;
      } catch (err) {
        showToast(err.message);
        throw err;
      }
    }

    function toggleAuthMode(mode) {
      if (mode === 'register') {
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('registerCard').classList.remove('hidden');
      } else {
        document.getElementById('registerCard').classList.add('hidden');
        document.getElementById('loginCard').classList.remove('hidden');
      }
    }

    async function handleAuthLogin(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;

      const data = await apiRequest('login', { email, password });
      AppState.user = data;
      AppState.tenantId = data.companyId;
      AppState.settings = data.settings;

      document.getElementById('authContainer').classList.add('hidden');
      document.getElementById('userContext').innerText = `${data.name} (${data.role})`;
      
      applySettings();
      showToast('Login successful!');
    }

    async function handleAuthRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      const res = await apiRequest('registerUser', { name, email, password });
      showToast(res.message);
      toggleAuthMode('login');
    }

    function applySettings() {
      if (AppState.settings.APP_NAME) {
        document.getElementById('appBrandTitle').innerText = AppState.settings.APP_NAME;
        document.getElementById('navTenantName').innerText = AppState.settings.APP_NAME;
        document.getElementById('settingAppName').value = AppState.settings.APP_NAME;
      }
    }

    async function handleSaveSetting(e) {
      e.preventDefault();
      const appName = document.getElementById('settingAppName').value;
      const res = await apiRequest('updateSettings', { key: 'APP_NAME', value: appName, category: 'Branding' });
      showToast(res.message);
      AppState.settings.APP_NAME = appName;
      applySettings();
    }

    function navigate(viewName) {
      document.querySelectorAll('.view-panel').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      if (viewName === 'dashboard') {
        document.getElementById('viewDashboard').classList.remove('hidden');
      } else if (viewName === 'settings') {
        document.getElementById('viewSettings').classList.remove('hidden');
      }
      document.getElementById('viewTitle').innerText = viewName.toUpperCase();
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
